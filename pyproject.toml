[project]
name = "agent-squad"
version = "0.1.0"
description = "A squad of narrowly scoped AI agents that finds leads, sells, builds and maintains websites, with a human approving what costs money or reputation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "psycopg[binary]>=3.2",
    "fastembed>=0.4",
]

[project.optional-dependencies]
leads = ["duckdb>=1.1"]
hermes = ["pyyaml>=6"]

[project.scripts]
squad = "agent_squad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "duckdb>=1.1", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_squad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real: uses real external tools (Claude Code); run with -m real"]
addopts = "-m 'not real'"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
