services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: squad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squad_dev}
      POSTGRES_DB: squad
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
